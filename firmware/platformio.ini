; SentinelMesh firmware — PlatformIO project
; Boards: 3x ESP32-WROOM-32 dev boards (field node, gateway, attacker), Arduino framework.
; Shared protocol code lives in lib/sentinel_proto (portable C++, no Arduino.h dependency
; in the core so it can also be unit-tested on the host — see test/test_native and
; README.md "Host-side unit tests").

[platformio]
default_envs = field_node, gateway, attacker

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Isrc                    ; so `#include "common/board_config.h"` resolves
build_unflags =
    -std=gnu++11
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    ; Crypto: wolfSSL first choice for ML-KEM / ML-DSA (see src/benchmark).
    ; If wolfCrypt's PQC build doesn't fit/compile for this target, switch this
    ; line to a PQClean-based Arduino wrapper (see firmware/README.md).
    wolfssl/wolfSSL @ ^5.7.0

[env:field_node]
build_src_filter = +<field_node/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_FIELD_NODE -DSENTINEL_NODE_ID=1

[env:gateway]
build_src_filter = +<gateway/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_GATEWAY -DSENTINEL_NODE_ID=2

[env:attacker]
build_src_filter = +<attacker/> +<common/>
build_flags = ${env.build_flags} -DSENTINEL_ROLE_ATTACKER -DSENTINEL_NODE_ID=3

[env:benchmark]
; Standalone crypto benchmark sketch — flash to any of the 3 boards to get
; ML-KEM-512/768/1024 + ML-DSA-44 timing/heap/stack numbers before wiring
; the real handshake in. See src/benchmark/main.cpp.
build_src_filter = +<benchmark/>

; Host-side unit tests (no ESP32 hardware needed) for the portable parts of
; sentinel_proto: packet header, fragmentation/reassembly, replay window.
; PlatformIO i